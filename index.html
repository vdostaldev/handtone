<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handtone</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handtone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @font-face { font-family:"Source Serif 4"; src:url(vendor/source-serif-4.woff2) format("woff2"); font-weight:400; font-display:swap; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; color:#fff; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); background:#000; }
  #overlay { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; transition:opacity .9s ease; touch-action:none; }
  #loader.off { opacity:0; pointer-events:none; }
  #dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:breathe 1.5s ease-in-out infinite; }
  #tap { position:absolute; top:calc(50% + 22px); color:#777; font:300 12px/1 -apple-system,"Helvetica Neue",sans-serif; letter-spacing:.24em; text-indent:.24em; opacity:0; transition:opacity .6s ease; }
  #tap.on { opacity:1; }
  #tap.long { left:32px; right:32px; text-align:center; letter-spacing:.06em; text-indent:0; line-height:1.6; }
  @keyframes breathe { 0%,100% { transform:scale(.7); opacity:.45; } 50% { transform:scale(1.5); opacity:1; } }
  #values { position:fixed; top:calc(env(safe-area-inset-top) + 12px); right:calc(env(safe-area-inset-right) + 12px); min-width:44px; min-height:32px; padding:9px 11px; box-sizing:border-box; border-radius:10px; background:rgba(0,0,0,.55); color:#fff; font:11px/1.35 ui-monospace,Menlo,monospace; display:none; }
  #values.on { display:block; }
  #valuesLabel { text-align:right; color:#30d5c8; letter-spacing:.04em; }
  #valuesBody { width:178px; margin-top:7px; }
  #valuesBody[hidden] { display:none; }
  #valuesBody h2 { margin:9px 0 4px; font:inherit; color:#30d5c8; }
  #recalibrate { width:100%; min-height:36px; margin-top:9px; border:1px solid #30d5c8; border-radius:7px; background:none; color:#30d5c8; font:inherit; }
  #calibrate { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 40px); transform:translateX(-50%); width:min(260px, calc(100% - 48px)); padding:12px 14px; box-sizing:border-box; border-radius:10px; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .4s ease; }
  #calibrate.on { opacity:1; }
  #calibrateText { text-align:center; font:300 13px/1.4 -apple-system,"Helvetica Neue",sans-serif; }
  #calibrateTrack { height:2px; margin-top:10px; background:rgba(255,255,255,.2); }
  #calibrateBar { width:0; height:100%; background:#30d5c8; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:7px; }
  .row > span:first-child { min-width:46px; flex:none; white-space:nowrap; color:#bbb; }
  .row > span:last-child { flex:none; text-align:right; font-variant-numeric:tabular-nums; }
  .row > i { flex:1; height:3px; background:rgba(255,255,255,.2); }
  .row > i > b { display:block; height:100%; background:#30d5c8; }
  .row > i.shut > b { background:#fff; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="values"><div id="valuesLabel">values</div><div id="valuesBody" hidden><div id="valuesData"></div><button id="recalibrate" type="button">recalibrate</button></div></div>
<div id="calibrate"><div id="calibrateText">hold your hand up, open and relaxed</div><div id="calibrateTrack"><div id="calibrateBar"></div></div></div>
<div id="loader"><div id="dot"></div><div id="tap">tap</div></div>
<script type="module" src="app.js"></script>
</body>
</html>

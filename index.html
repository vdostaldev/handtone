<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handtone</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handtone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; font-family:-apple-system,"Helvetica Neue",sans-serif; color:#fff; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); background:#000; }
  #overlay { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; box-sizing:border-box; background:#000; text-align:center; transition:opacity .4s ease; }
  #start.off { opacity:0; pointer-events:none; }
  h1 { margin:0; font-size:30px; font-weight:600; letter-spacing:-.01em; }
  #go { min-width:150px; min-height:52px; padding:0 30px; border:0; border-radius:26px; background:#14e0bc; color:#04231d; font:600 17px -apple-system,"Helvetica Neue",sans-serif; }
  #go:disabled { opacity:.55; }
  #message { min-height:44px; max-width:300px; margin:0; color:#aaa; font-size:15px; line-height:1.45; }
  #hint { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 36px); text-align:center; pointer-events:none; transition:opacity .4s ease; }
  #hint span { display:inline-block; padding:10px 18px; border-radius:22px; background:rgba(0,0,0,.6); font-size:15px; }
  #hint.off { opacity:0; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="hint" class="off"><span>Hold up a hand and close it to play</span></div>
<div id="start">
  <h1>Handtone</h1>
  <button id="go" type="button">Start</button>
  <p id="message"></p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
